[project]
name = "micro-blss"
version = "0.1.0"
description = "Micro-BLSS (Bioregenerative Life Support System) Simulator — NASA MEC plant growth model ported from V-HAB"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "simpy>=4.1",
    "streamlit>=1.30",
    "paho-mqtt>=2.0",
    "pandas>=2.1",
    "rich>=13.7",
]



[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src"]
omit = ["src/*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
