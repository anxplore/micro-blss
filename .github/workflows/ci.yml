name: CI — V&V Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run V&V test suite
        run: uv run pytest tests/ -v --tb=short --log-cli-level=WARNING

      - name: Run test suite with coverage
        run: uv run pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  lint:
    name: "Lint & Type Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check import sorting
        run: uv run python -c "import ast; import sys; [ast.parse(open(f).read()) for f in sys.argv[1:]]" src/utils/validation.py src/modules/plant.py
        continue-on-error: true

  smoke:
    name: "Smoke Test — 48h Simulation"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run 48h simulation smoke test
        run: |
          uv run python -c "
          import logging
          logging.basicConfig(level=logging.WARNING)
          from src.core import Simulation
          sim = Simulation()
          sim.run(48, 0.5)
          state = sim.buffer.get_state()
          assert state['o2_percent'] > 19.0, f'O2 too low: {state[\"o2_percent\"]:.2f}%'
          assert state['co2_ppm'] < 10000, f'CO2 too high: {state[\"co2_ppm\"]:.0f} ppm'
          print(f'PASS — O2: {state[\"o2_percent\"]:.2f}%, CO2: {state[\"co2_ppm\"]:.0f} ppm')
          "
